  <script>
    // Giả lập tương tác mở/đóng Accordion của Teams
    document.querySelectorAll('.fui-AccordionHeader__button').forEach(btn => {
      btn.addEventListener('click', () => {
        const isExpanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!isExpanded));
        const item = btn.closest('.fui-AccordionItem');
        const panel = item.querySelector('.fui-AccordionPanel');
        if (panel) {
          panel.style.display = isExpanded ? 'none' : '';
        }
      });
    });

    // Giả lập chuyển đổi App trên App Bar (Chat, Teams, Calendar,...)
    document.querySelectorAll('[role="navigation"][aria-label="Apps"] button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[role="navigation"][aria-label="Apps"] button').forEach(b => {
          b.setAttribute('aria-pressed', 'false');
        });
        btn.setAttribute('aria-pressed', 'true');

        const isTeams = btn.getAttribute('aria-label') === 'Teams';
        const gridView = document.querySelector('[data-tid="teams-grid-view"]');
        if (gridView) {
          gridView.style.display = isTeams ? '' : 'none';
        }
      });
    });
  </script>
